name: Deploy LDOC Studio to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Assemble Web Distribution
        run: |
          node ./build_static.js
          mkdir -p _site
          cp -r public/* _site/
          touch _site/.nojekyll
          echo "Web distribution assembled successfully:"
          ls -la _site

      - name: Deploy to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          force_orphan: true

      - name: Setup GitHub Pages (Direct Actions)
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        continue-on-error: true
        with:
          path: './_site'

      - name: Deploy to GitHub Pages (Direct Actions)
        id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
