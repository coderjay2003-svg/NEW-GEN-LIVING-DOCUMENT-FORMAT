name: LDOC CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  test:
    name: Conformance & Master Integration Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [ 18.x, 20.x, 22.x ]

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install Dependencies
      run: npm install

    - name: Verify Architecture Conformance
      run: node tests/test_section8_arch.js

    - name: Run Core Module Unit Tests
      run: node tests/test_section1_unit.js

    - name: Run Cross-Surface Consistency Tests (Zero Drift)
      run: node tests/test_section2_cross_surface.js

    - name: Run SDK Conformance Test Suite
      run: node packages/ldoc-sdk/test.js

    - name: Verify Master Build Pipeline
      run: npm run build
